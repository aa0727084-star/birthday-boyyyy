<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter For You ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0e0e0e;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0e0e0e 100%);
            color: white;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* توسيط الكارت في نص الشاشة بالظبط */
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d4af37;
            font-size: 2.8rem;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* حاوية الجواب الملمومة والمظبوطة المقاس */
        .letter-container {
            width: 100%;
            max-width: 450px; /* مقاس ملموم جداً وشيك */
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            z-index: 100;
        }

        .letter-container:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* تظبيط مقاس الصورة الصارم عشان تبان كاملة ونضيفة */
        .letter-image-wrapper {
            width: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-image-wrapper img {
            width: 100%;
            height: auto;
            max-height: 480px; /* سقف الارتفاع عشان م تفرشش في الشاشة */
            object-fit: contain; /* إظهار الصورة كاملة بدون أي قص أو مط */
            display: block;
        }

        /* زرار العودة الفخم */
        .back-btn {
            margin-top: 30px;
            padding: 10px 30px;
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 100;
        }

        .back-btn:hover {
            background: linear-gradient(45deg, #d4af37, #b8962e);
            color: #0e0e0e;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <h1>A Letter For You</h1>

    <div class="letter-container">
        <div class="letter-image-wrapper">
            <img src="letterpic.jpg" alt="My Special Letter for Moaz">
        </div>
    </div>

    <a href="special.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> يلا ي لولي لسه
    </a>

    <script>
        function createLetterStar() {
            const star = document.createElement('div');
            star.innerHTML = '✨';
            star.style.position = 'fixed';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.fontSize = Math.random() * 12 + 8 + 'px';
            star.style.color = '#d4af37';
            star.style.opacity = Math.random();
            star.style.pointerEvents = 'none';
            star.style.zIndex = '1';
            star.style.transition = 'opacity 2s';

            document.body.appendChild(star);

            setTimeout(() => {
                star.style.opacity = '0';
                setTimeout(() => star.remove(), 2000);
            }, 3000);
        }
        setInterval(createLetterStar, 400);
    </script>
<audio id="globalBgMusic" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const audio = document.getElementById('globalBgMusic');

        // 1. استرجاع الوقت اللي وقفت عنده الأغنية من الصفحة اللي فاتت
        const savedTime = localStorage.getItem('bgMusicTime');
        if (savedTime) {
            audio.currentTime = parseFloat(savedTime);
        }

        // 2. تشغيل الأغنية عند أول ضغطة للمستخدم في الصفحة لتخطي حماية المتصفح
        function playAudio() {
            audio.play().catch(e => console.log("في انتظار تفاعل المستخدم"));
        }
        document.body.addEventListener('click', playAudio, { once: true });
        
        // محاولة تشغيل تلقائي إذا كان المتصفح يسمح
        audio.play().catch(e => {});

        // 3. حفظ وقت الأغنية الحالي كل ثانية في ذاكرة المتصفح عشان الصفحة اللي بعدها تقراه
        setInterval(() => {
            if (!audio.paused) {
                localStorage.setItem('bgMusicTime', audio.currentTime);
                localStorage.setItem('bgMusicState', 'playing');
            }
        }, 1000);

        // 4. حفظ الوقت فوراً قبل ما يقفل الصفحة أو يتنقل
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('bgMusicTime', audio.currentTime);
        });
    });
</script>
</body>
</html>
