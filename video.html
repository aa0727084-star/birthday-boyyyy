<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Video 🎬❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0e0e0e;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0e0e0e 100%);
            color: white;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d4af37;
            font-size: 2.8rem;
            margin-bottom: 5px;
            text-align: center;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 35px;
            text-align: center;
        }

        /* حاوية مشغل الفيديو الفخمة والمضمونة للموبايل والكمبيوتر */
        .video-container {
            width: 100%;
            max-width: 600px; 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            z-index: 100;
        }

        .video-container:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }

        /* تظبيط عرض المشغل بنسبة مرنة ومريحة لمنع السواد */
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            border-radius: 12px;
            display: block;
            background-color: #000;
        }

        /* زرار العودة */
        .back-btn {
            margin-top: 35px;
            padding: 10px 30px;
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 100;
        }

        .back-btn:hover {
            background: linear-gradient(45deg, #d4af37, #b8962e);
            color: #0e0e0e;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <h1>Our Story in Video</h1>
    <p class="subtitle">حكايتنا الحلوة متلخصة في كام ثانية.. اتفرج للآخر وعيد اللحظة 🎞️❤️</p>

    <div class="video-container">
        <video controls autoplay preload="auto">
            <source src="love.mp4" type="video/mp4">
            <source src="love.webm" type="video/webm">
            <source src="love.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
    </div>

    <a href="final.html" class="back-btn" style="border-color: #ff4d4d; color: #ff4d4d; box-shadow: 0 0 15px rgba(255, 77, 77, 0.2);">
        التالي.. المفاجأة الأخيره بالكامل 🌟❤️
    </a>
    <script>
        function createVideoStar() {
            const star = document.createElement('div');
            star.innerHTML = '✨';
            star.style.position = 'fixed';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.fontSize = Math.random() * 12 + 8 + 'px';
            star.style.color = '#d4af37';
            star.style.opacity = Math.random();
            star.style.pointerEvents = 'none';
            star.style.zIndex = '1';
            star.style.transition = 'opacity 2s';
            document.body.appendChild(star);
            setTimeout(() => { star.style.opacity = '0'; setTimeout(() => star.remove(), 2000); }, 3000);
        }
        setInterval(createVideoStar, 400);
    </script>
<audio id="globalBgMusic" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const bgAudio = document.getElementById('globalBgMusic');
        const myVideo = document.getElementById('myVideo') || document.querySelector('video');

        // 1. استرجاع الوقت من الصفحة السابقة وتشغيل الأغنية في الخلفية بنعومة
        const savedTime = localStorage.getItem('bgMusicTime');
        if (savedTime) {
            bgAudio.currentTime = parseFloat(savedTime);
        }

        // تشغيل أغنية الخلفية مع أول ضغطة في الصفحة
        document.body.addEventListener('click', function() {
            if (bgAudio.paused && myVideo.paused) {
                bgAudio.play().catch(e => {});
            }
        }, { once: true });

        bgAudio.play().catch(e => {});

        // 2. الحل الجذري: التحكم الصارم في الفيديو والأغنية
        
        // أ. أول ما الفيديو يشتغل -> الأغنية تقف وتكتم فوراً (إجباري)
        myVideo.addEventListener('play', function() {
            bgAudio.pause();
            bgAudio.muted = true; // كتم إضافي للأمان عشان الصوت ما يتسربش
            localStorage.setItem('bgMusicState', 'paused_by_video');
        });

        // ب. أول ما الفيديو يقف مؤقتاً -> الأغنية ترجع وتشتغل
        myVideo.addEventListener('pause', function() {
            bgAudio.muted = false;
            bgAudio.play().catch(e => {});
            localStorage.setItem('bgMusicState', 'playing');
        });

        // جـ. أول ما الفيديو يخلص خالص -> الأغنية ترجع وتشتغل
        myVideo.addEventListener('ended', function() {
            bgAudio.muted = false;
            bgAudio.play().catch(e => {});
            localStorage.setItem('bgMusicState', 'playing');
        });

        // 3. تحديث الوقت المستمر في الذاكرة
        setInterval(() => {
            if (!bgAudio.paused) {
                localStorage.setItem('bgMusicTime', bgAudio.currentTime);
            }
        }, 1000);

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('bgMusicTime', bgAudio.currentTime);
        });
    });
</script>

</body>
</html>
</body>
</html>
